
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravindra College Bus Tracker</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }

    header {
      background: #173b70;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }

    header h2 { margin: 0 0 8px; }
    header p { margin: 0; }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    button {
      background: #1764c0;
      color: white;
      border: 0;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }

    button:disabled {
      background: #8b9bb0;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 14px auto;
    }

    #map {
      width: 100%;
      height: 380px;
      border-radius: 10px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #edf4ff;
      margin-top: 12px;
      line-height: 1.5;
    }

    .hint {
      color: #566174;
      font-size: 14px;
      line-height: 1.5;
    }

    .bus-icon {
      font-size: 27px;
      text-align: center;
    }
  </style>
</head>

<body>
<header>
  <h2>Ravindra College Bus Tracker</h2>
  <p>Ravindra College of Engineering for Women, Kurnool</p>
</header>

<main class="container">
  <section class="card">
    <h3>Scan Bus Stop QR Code</h3>
    <p class="hint">
      Keep the QR code steady in front of the camera.
      The same valid code must be detected for 2 seconds
      before the map opens.
    </p>

    <button id="startBtn" onclick="startScan()">
      Start QR Scanner
    </button>

    <div id="reader"></div>

    <div id="scanStatus" class="status" aria-live="polite">
      Please scan a valid bus stop QR code to view the map.
    </div>
  </section>

  <section id="mapSection" class="card" style="display:none">
    <h3>Bus Location Map</h3>
    <div id="map"></div>
    <div id="busDetails" class="status"></div>
    <button onclick="scanAgain()">Scan Another QR Code</button>
  </section>
</main>

<script>
  let scanner = null;
  let scanning = false;
  let processingScan = false;

  let candidateValue = "";
  let candidateStart = 0;
  let lastSeen = 0;
  let checkTimer = null;

  let map = null;
  let busMarker = null;
  let routeLine = null;
  let busTimer = null;
  let busPosition = 0;

  const stops = [
    {
      name: "Kurnool Bus Stand",
      lat: 15.8280,
      lng: 78.0370
    },
    {
      name: "College Main Gate",
      lat: 15.7952,
      lng: 78.0771
    },
    {
      name: "College Campus",
      lat: 15.7958,
      lng: 78.0780
    }
  ];

  function matchQR(decodedText) {
    const value = decodedText.trim();

    // Accept a URL such as https://example.com/?stop=2
    try {
      const url = new URL(value);
      const stopParam = url.searchParams.get("stop");

      if (stopParam !== null &&
          /^[0-2]$/.test(stopParam)) {
        return Number(stopParam);
      }
    } catch (e) {
      // The scanned value may be plain text.
    }

    const normalized = value.toLowerCase();

    if (normalized === "0" ||
        normalized === "1" ||
        normalized === "2") {
      return Number(normalized);
    }

    if (normalized === "kurnool bus stand") return 0;
    if (normalized === "college main gate") return 1;
    if (normalized === "college campus") return 2;

    return -1;
  }

  function resetCandidate() {
    candidateValue = "";
    candidateStart = 0;
    lastSeen = 0;

    if (checkTimer) {
      clearTimeout(checkTimer);
      checkTimer = null;
    }
  }

  function onScanSuccess(decodedText) {
    if (!scanning || processingScan) return;

    const stopIndex = matchQR(decodedText);

    if (stopIndex === -1) {
      resetCandidate();
      document.getElementById("scanStatus").textContent =
        "Invalid QR code. Please scan a Ravindra Bus Tracker QR code.";
      return;
    }

    const now = Date.now();

    if (candidateValue !== decodedText) {
      resetCandidate();
      candidateValue = decodedText;
      candidateStart = now;
    }

    lastSeen = now;

    const elapsed = now - candidateStart;
    const remaining = Math.max(0, 2000 - elapsed);

    document.getElementById("scanStatus").textContent =
      "QR detected. Hold it steady... " +
      Math.ceil(remaining / 1000) + " second(s) remaining.";

    if (elapsed >= 2000) {
      processingScan = true;
      finishScan(stopIndex);
      return;
    }

    if (!checkTimer) {
      checkTimer = setTimeout(() => {
        checkTimer = null;

        // If the code is no longer being detected, require
        // the user to hold it steady and try again.
        if (Date.now() - lastSeen > 700) {
          resetCandidate();
          document.getElementById("scanStatus").textContent =
            "QR lost. Hold the QR code steadily in front of the camera.";
        }
      }, 2100);
    }
  }

  async function startScan() {
    if (scanning || processingScan) return;

    if (typeof Html5Qrcode === "undefined") {
      document.getElementById("scanStatus").textContent =
        "Scanner library did not load. Check your internet connection and refresh.";
      return;
    }

    document.getElementById("startBtn").disabled = true;
    document.getElementById("scanStatus").textContent =
      "Opening camera... Please allow camera access.";

    resetCandidate();

    try {
      scanner = new Html5Qrcode("reader");
      scanning = true;

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 230, height: 230 },
          aspectRatio: 1.0
        },
        onScanSuccess,
        function () {
          // Ignore frames where no QR code is detected.
        }
      );

      document.getElementById("scanStatus").textContent =
        "Camera ready. Hold a valid QR code steady for 2 seconds.";
    } catch (error) {
      scanning = false;
      scanner = null;
      document.getElementById("startBtn").disabled = false;

      document.getElementById("scanStatus").textContent =
        "Could not start camera. Allow camera permission and open the website using HTTPS.";
    }
  }

  async function stopScan() {
    scanning = false;
    resetCandidate();

    const currentScanner = scanner;
    scanner = null;

    if (currentScanner) {
      try {
        await currentScanner.stop();
      } catch (e) {
        // Camera may already be stopped.
      }

      try {
        currentScanner.clear();
      } catch (e) {
        // Reader may already be cleared.
      }
    }

    document.getElementById("reader").innerHTML = "";
    document.getElementById("startBtn").disabled = false;
  }

  async function finishScan(stopIndex) {
    document.getElementById("scanStatus").textContent =
      "QR confirmed. Closing scanner...";

    // Close the camera before revealing the map.
    await stopScan();

    document.getElementById("mapSection").style.display = "block";
    showMap(stopIndex);

    document.getElementById("scanStatus").textContent =
      "QR scanned successfully. Camera closed.";
    document.getElementById("mapSection").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function showMap(stopIndex) {
    const selectedStop = stops[stopIndex];

    if (busTimer) {
      clearInterval(busTimer);
      busTimer = null;
    }

    if (map) {
      map.remove();
      map = null;
      busMarker = null;
      routeLine = null;
    }

    busPosition = 0;

    map = L.map("map").setView(
      [selectedStop.lat, selectedStop.lng], 14
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }
    ).addTo(map);

    stops.forEach((stop) => {
      L.marker([stop.lat, stop.lng])
        .addTo(map)
        .bindPopup(stop.name);
    });

    const routeCoordinates = [
      [stops[0].lat, stops[0].lng],
      [15.8170, 78.0500],
      [stops[1].lat, stops[1].lng],
      [stops[2].lat, stops[2].lng]
    ];

    routeLine = L.polyline(routeCoordinates, {
      color: "#1764c0",
      weight: 5
    }).addTo(map);

    const busIcon = L.divIcon({
      className: "",
      html: '<div class="bus-icon">🚌</div>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    busMarker = L.marker(routeCoordinates[0], {
      icon: busIcon
    }).addTo(map).bindPopup("Demo bus location");

    document.getElementById("busDetails").innerHTML =
      "<strong>Selected stop:</strong> " + selectedStop.name +
      "<br><strong>Bus:</strong> Simulated demo bus" +
      "<br><strong>Status:</strong> Moving on a sample route" +
      "<br><span class='hint'>The route and coordinates are illustrative, not verified live bus GPS data.</span>";

    setTimeout(() => map.invalidateSize(), 250);

    busTimer = setInterval(() => {
      busPosition = (busPosition + 1) % routeCoordinates.length;

      busMarker.setLatLng(routeCoordinates[busPosition]);
    }, 3000);
  }

  async function scanAgain() {
    if (busTimer) {
      clearInterval(busTimer);
      busTimer = null;
    }

    if (map) {
      map.remove();
      map = null;
      busMarker = null;
      routeLine = null;
    }

    document.getElementById("mapSection").style.display = "none";
    document.getElementById("scanStatus").textContent =
      "Ready to scan another QR code.";

    processingScan = false;
    resetCandidate();

    await startScan();
  }
</script>
</body>
</html>
